<!DOCTYPE html>
<html>
    <head>
        <title>My Search Engine</title>
    </head>
<body>
    <h1>🔎Smart Search Engine</h1>
    <form method="POST">
        <input type="text" name="user_query" placeholder="Type your search here....🔎" autocomplete="off">
        <button type="submit">Search</button>
    </form>
    {% if message %}
        <p><strong>You searched for:</strong>{{ message }}</p> 
    {% endif %}
</body>
</html>
